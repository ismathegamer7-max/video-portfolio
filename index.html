<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Isma - Video Editor</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    background: #111;
    color: white;
}

.hero {
    min-height: 100vh;
    padding: 50px 25px;
    background:
        linear-gradient(rgba(0,0,0,.65), rgba(0,0,0,.85)),
        radial-gradient(circle at top, #333, #111 70%);
}

.container {
    max-width: 1100px;
    margin: auto;
}

.profile {
    text-align: center;
    margin-bottom: 45px;
}

.profile-picture {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #ffd400;
    margin-bottom: 15px;
}

h1 {
    font-size: 42px;
    margin-bottom: 8px;
}

.subtitle {
    color: #ccc;
    font-size: 18px;
}

.contacts {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 25px;
}

.contact {
    text-decoration: none;
    color: white;
    background: #222;
    border: 1px solid #444;
    padding: 12px 20px;
    border-radius: 10px;
    transition: .2s;
}

.contact:hover {
    background: #ffd400;
    color: #111;
}.portfolio-title {
    font-size: 28px;
    margin-bottom: 20px;
}

.folders {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 18px;
}

.folder {
    background: #1c1c1c;
    border: 1px solid #333;
    border-radius: 14px;
    padding: 25px;
    text-decoration: none;
    color: white;
    transition: .2s;
}

.folder:hover {
    transform: translateY(-4px);
    border-color: #ffd400;
}

.folder-icon {
    font-size: 45px;
    margin-bottom: 12px;
}

.folder h3 {
    font-size: 20px;
    margin-bottom: 6px;
}

.folder p {
    color: #999;
}

footer {
    text-align: center;
    color: #777;
    margin-top: 60px;
    padding-bottom: 20px;
}</style>
</head>

<body>

<div class="hero">
<div class="container">

<section class="profile">

<img
class="profile-picture"
src="https://via.placeholder.com/120"
alt="Profile">

<h1>Isma</h1>

Video Editor • Short Form • Gaming • YouTube
</p>

<div class="contacts">

</a>

Discord
</a>

<a class="contact" href="mailto:your@email.com">
Email
</a>

<a class="contact" href="tel:+256000000000">
Call
</a>

</div>
</section>

<section>

<h2 class="portfolio-title">My Work</h2>

<div class="folders">

<a class="folder" href="#">
<div class="folder-icon">📁</div>
<h3>Gaming</h3>
<p>Gaming edits and highlights</p>
</a>

<a class="folder" href="#">
<div class="folder-icon">📁</div>
<h3>Short Form</h3>
<p>Reels, Shorts and TikTok edits</p>
</a>

<a class="folder" href="#">
<div class="folder-icon">📁</div>

<p>Long-form YouTube editing</p>
</a>

<a class="folder" href="#">
<div class="folder-icon">📁</div>
<h3>Cinematic</h3>
<p>Cinematic and storytelling work</p>
</a>

</div>
</section>

<footer>
© 2026 Isma — Video Editor
</footer>

</div>
</div>

</body>
</html>
